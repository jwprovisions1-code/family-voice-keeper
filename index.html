<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>A Visit</title>
<style>
  html,body{margin:0;height:100%;background:#141210;color:#f2ede4;font-family:Georgia,'Times New Roman',serif}
  .wrap{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:16px;box-sizing:border-box}
  h1{font-size:20px;font-weight:normal;text-align:center;opacity:.85;margin:8px 0 12px}
  .frame{flex:0 0 auto;height:52vh;min-height:300px;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  .frame iframe{width:100%;height:100%;border:0}
  .log{flex:1;margin:16px 0;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
  .msg{padding:10px 14px;border-radius:14px;max-width:85%;line-height:1.45;font-size:17px}
  .her{align-self:flex-start;background:#2e2a24}
  .me{align-self:flex-end;background:#3d4a5c}
  .thinking{font-style:italic;opacity:.6}
  .controls{display:flex;justify-content:center;gap:10px;padding:10px 0 6px}
  button{font-size:18px;padding:14px 34px;border-radius:999px;border:0;background:#c8a24a;color:#1a1712;cursor:pointer}
  button.listening{background:#d45f4b}
  button:disabled{opacity:.5}
  .typerow{display:flex;gap:8px;padding:6px 0 16px}
  .typerow input{flex:1;font-size:16px;padding:12px 16px;border-radius:999px;border:1px solid #4a443a;background:#1e1a16;color:#f2ede4;font-family:inherit}
  .typerow button{padding:12px 22px;font-size:16px}
  .hint{text-align:center;font-size:13px;opacity:.55;margin:0;padding-bottom:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Come say hello</h1>
  <div class="frame"><iframe src="https://blocks.glass/embed/f85f04fb-5866-4ac0-9312-4e044835fe2e" allow="autoplay; encrypted-media; xr-spatial-tracking; accelerometer; gyroscope; magnetometer" allowfullscreen loading="lazy"></iframe></div>
  <div class="log" id="log"></div>
  <div class="controls"><button id="talk">Talk to her</button></div>
  <div class="typerow"><input id="typed" type="text" placeholder="...or type to her here" autocomplete="off"><button id="send">Send</button></div>
  <div class="hint">Tap the button, speak, then tap again when you finish.</div>
</div>
<script>
const ACCESS_TOKEN = "__ACCESS_TOKEN__";
const log = document.getElementById('log');
const btn = document.getElementById('talk');
const typed = document.getElementById('typed');
const sendBtn = document.getElementById('send');
const history = [];
let rec = null, listening = false, actx = null;

function add(role, text){
  const d = document.createElement('div');
  d.className = 'msg ' + (role === 'user' ? 'me' : 'her');
  d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}

// iOS Safari only allows sound from an AudioContext that was created/resumed inside a tap.
function ensureAudio(){
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}

async function speak(blob, done){
  try {
    ensureAudio();
    if (!actx) return done();
    const ab = await actx.decodeAudioData(await blob.arrayBuffer());
    const src = actx.createBufferSource();
    src.buffer = ab; src.connect(actx.destination);
    src.onended = done;
    src.start();
  } catch (e) { done(); }
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) { btn.disabled = true; document.querySelector('.hint').textContent = 'Speech recognition is not available in this browser - typing below works everywhere.'; }

btn.onclick = () => {
  ensureAudio();
  if (listening) { rec && rec.stop(); return; }
  rec = new SR();
  rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 1;
  listening = true; btn.classList.add('listening'); btn.textContent = 'Listening... tap to send';
  let finalText = '';
  rec.onresult = e => { finalText += e.results[0][0].transcript; };
  rec.onerror = () => { stopUI(); };
  rec.onend = () => { stopUI(); if (finalText.trim()) converse(finalText.trim()); };
  rec.start();
  function stopUI(){ listening = false; btn.classList.remove('listening'); btn.textContent = 'Talk to her'; }
};

sendBtn.onclick = () => { ensureAudio(); const t = typed.value.trim(); if (t) { typed.value = ''; converse(t); } };
typed.addEventListener('keydown', e => { if (e.key === 'Enter') sendBtn.onclick(); });

async function converse(text){
  add('user', text);
  history.push({ role: 'user', text });
  btn.disabled = true; sendBtn.disabled = true;
  const thinking = add('her', '...');
  thinking.classList.add('thinking');
  try {
    const cr = await fetch('api/chat', { method: 'POST', headers: {'Content-Type':'application/json','x-access-token':ACCESS_TOKEN}, body: JSON.stringify({ history }) });
    const cj = await cr.json();
    const reply = (cj.text || '').trim() || 'I am here, honey.';
    thinking.remove();
    add('her', reply);
    history.push({ role: 'model', text: reply });
    const tr = await fetch('api/tts', { method: 'POST', headers: {'Content-Type':'application/json','x-access-token':ACCESS_TOKEN}, body: JSON.stringify({ text: reply }) });
    if (tr.ok) {
      const blob = await tr.blob();
      await speak(blob, () => { btn.disabled = false; sendBtn.disabled = false; });
    } else { btn.disabled = false; sendBtn.disabled = false; }
  } catch (e) {
    thinking.remove();
    add('her', 'Give me just a moment, honey - try me again.');
    btn.disabled = false; sendBtn.disabled = false;
  }
}

add('her', 'Hi honey. Tap the button and talk to me.');
</script>
</body>
</html>
